<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Upcycling in 30 Seconds</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="brand.css">
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      /* presenter fills everything below the fold (see the fold rule in brand.css) */
      #presenter { position: absolute; left: 0; top: var(--fold); width: 1080px; height: calc(1920px - var(--fold));
        object-fit: cover; object-position: center 20%; }
    </style>
  </head>
  <body>
    <!-- Reel template: shared ambient background, one host per beat, one caption track, presenter. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="bg" class="layer" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="title" class="layer" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="headings" class="layer" data-composition-id="headings" data-composition-src="compositions/headings.html" data-start="4" data-duration="26" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="diagram" class="layer" data-composition-id="diagram" data-composition-src="compositions/diagram.html" data-start="4" data-duration="26" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="result" class="layer" data-composition-id="result" data-composition-src="compositions/result.html" data-start="24.5" data-duration="5.5" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" class="layer" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30" data-track-index="5" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <img id="presenter" class="clip" src="assets/presenter.jpg" alt="Presenter placeholder" data-start="0" data-duration="30" data-track-index="6">
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
