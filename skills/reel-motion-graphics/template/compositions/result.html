<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* Results 24.5–30 s (local 0–5.5): two glass stat cards count up from the dense 6.74B. */
        #root { position: absolute; inset: 0; color: var(--fg); }
        #rs-cards { position: absolute; left: var(--col-x); top: 380px; width: var(--col-w);
          display: flex; gap: 16px; perspective: 1100px; }
        .rs-card { flex: 1 1 0; min-width: 0; box-sizing: border-box; padding: 24px; }
        .rs-lab { font: 600 20px/20px var(--body); letter-spacing: .2em; text-transform: uppercase; color: #DCC7A2; }
        .rs-num { margin-top: 16px; font: 500 96px/96px var(--disp); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
        #rs-n1 { background: var(--gold-sheen); background-size: 300% 100%; background-position: calc(100% - var(--sheen,0) * 1%) 0;
          -webkit-background-clip: text; background-clip: text; color: transparent; }
        #rs-n2 { color: var(--pale); }
        .rs-sub { margin-top: 16px; font: 500 20px/24px var(--body); color: #DCC7A2; white-space: nowrap; }
        .rs-meta { position: absolute; left: var(--col-x); width: var(--col-w); font: 500 24px/32px var(--body); color: var(--mut); }
        #rs-m1 { top: 632px; }
        #rs-m2 { top: 664px; }
      </style>
      <div id="root" data-composition-id="result" data-width="1080" data-height="1920">
        <div id="rs-cards">
          <div id="rs-c1" class="rs-card glass">
            <div class="rs-lab">Total parameters</div>
            <div id="rs-n1" class="rs-num">6.7B</div>
            <div id="rs-s1" class="rs-sub">from 6.74B dense · 1.00×</div>
          </div>
          <div id="rs-c2" class="rs-card glass">
            <div class="rs-lab">Active per token</div>
            <div id="rs-n2" class="rs-num">6.7B</div>
            <div id="rs-s2" class="rs-sub">from 6.74B dense · 1.00×</div>
          </div>
        </div>
        <div id="rs-m1" class="rs-meta">7B shape · every second layer · 8 experts · top-2</div>
        <div id="rs-m2" class="rs-meta">arXiv 2212.05055</div>
      </div>
      <script>
        const ROOT = document.querySelector('[data-composition-id="result"]:not([data-composition-src])');
        const D = 6.74, tl = gsap.timeline({ paused: true });
        const count = (n, to, at, dur) => {
          const v = { x: D }, num = document.getElementById("rs-n" + n), sub = document.getElementById("rs-s" + n);
          tl.to(v, { x: to, duration: dur, ease: "power2.inOut", onUpdate: () => {
            num.textContent = v.x.toFixed(1) + "B";
            sub.textContent = "from " + D.toFixed(2) + "B dense · " + (v.x / D).toFixed(2) + "×";
          } }, at);
        };
        tl.fromTo("#rs-c1", { opacity: 0, rotationX: -28, z: -160, y: 30 }, { opacity: 1, rotationX: 0, z: 0, y: 0, duration: .9, ease: "power3.out" }, .5);
        tl.fromTo("#rs-c2", { opacity: 0, rotationX: -28, z: -160, y: 30 }, { opacity: 1, rotationX: 0, z: 0, y: 0, duration: .9, ease: "power3.out" }, 1.6);
        count(1, 21.89, .6, 1.4);
        count(2, 8.90, 1.7, 1.3);
        tl.fromTo("#rs-n1", { "--sheen": 0 }, { "--sheen": 100, duration: 1.4, ease: "power1.inOut" }, 2.0);
        tl.fromTo(".rs-card", { "--gloss": -1 }, { "--gloss": 2, duration: 1, ease: "power2.inOut", stagger: .15 }, 3.1);
        tl.fromTo(["#rs-m1", "#rs-m2"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .6, ease: "power3.out", stagger: .1 }, 1.9);
        tl.to(ROOT, { opacity: 0, duration: .55, ease: "power2.in" }, 4.95);
        window.__timelines["result"] = tl;
      </script>
    </template>
  </body>
</html>
